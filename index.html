// ─── AUDIO ENGINE ───────────────────────────────────────────
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,masterGain=null,ambiNode=null;
function initAudio(){
  if(ac)return;
  ac=new AC();
  masterGain=ac.createGain();masterGain.gain.value=0.8;
  masterGain.connect(ac.destination);
  startAmbience();
}

function startAmbience(){
  // Low city rumble
  const buf=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.15;
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=120;
  src.connect(f);f.connect(masterGain);src.start();
  ambiNode=src;
}

function playTone(cfg){
  if(!ac)return;
  const t=ac.currentTime;
  const osc=ac.createOscillator();
  const gain=ac.createGain();
  osc.type=cfg.type||'sine';
  osc.frequency.setValueAtTime(cfg.f1,t);
  if(cfg.f2)osc.frequency.exponentialRampToValueAtTime(cfg.f2,t+cfg.dur);
  gain.gain.setValueAtTime(cfg.vol||0.3,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+(cfg.rel||cfg.dur));
  osc.connect(gain);gain.connect(masterGain);
  osc.start(t);osc.stop(t+(cfg.rel||cfg.dur)+0.05);
}

function playNoise(dur,vol,type){
  if(!ac)return;
  const len=Math.round(ac.sampleRate*dur);
  const buf=ac.createBuffer(1,len,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=buf;
  const g=ac.createGain();g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  const f=ac.createBiquadFilter();
  if(type==='low'){f.type='lowpass';f.frequency.value=300;}
  else if(type==='mid'){f.type='bandpass';f.frequency.value=800;f.Q.value=2;}
  else{f.type='highpass';f.frequency.value=2000;}
  src.connect(f);f.connect(g);g.connect(masterGain);src.start();src.stop(ac.currentTime+dur+0.05);
}

function snd(type){
  if(!ac)return;
  try{
    if(type==='pistol'){
      playNoise(0.08,0.6,'mid');
      playTone({type:'sawtooth',f1:900,f2:180,dur:0.08,vol:0.25,rel:0.1});
      playTone({f1:200,f2:80,dur:0.12,vol:0.2});
    } else if(type==='shotgun'){
      playNoise(0.18,1.0,'low');playNoise(0.1,0.5,'mid');
      playTone({type:'sawtooth',f1:250,f2:60,dur:0.2,vol:0.4});
    } else if(type==='smg'){
      playNoise(0.05,0.35,'mid');
      playTone({type:'sawtooth',f1:700,f2:250,dur:0.05,vol:0.12});
    } else if(type==='rifle'){
      playNoise(0.04,0.9,'high');playNoise(0.15,0.6,'low');
      playTone({type:'sawtooth',f1:1400,f2:300,dur:0.12,vol:0.3});
    } else if(type==='shell'){
      playTone({type:'triangle',f1:800,f2:400,dur:0.06,vol:0.06});
    } else if(type==='kill'){
      playNoise(0.1,0.3,'low');
      playTone({type:'square',f1:180,f2:50,dur:0.22,vol:0.15});
    } else if(type==='hurt'){
      playNoise(0.12,0.5,'mid');
      playTone({type:'sawtooth',f1:140,f2:70,dur:0.18,vol:0.3});
    } else if(type==='pickup'){
      playTone({f1:440,f2:880,dur:0.1,vol:0.2});
      playTone({f1:660,f2:1320,dur:0.12,vol:0.15});
    } else if(type==='reload'){
      playTone({type:'triangle',f1:600,f2:400,dur:0.08,vol:0.15});
      setTimeout(()=>playTone({type:'triangle',f1:400,f2:600,dur:0.1,vol:0.2}),120);
    } else if(type==='empty'){
      playNoise(0.04,0.2,'high');
      playTone({type:'square',f1:120,f2:110,dur:0.06,vol:0.15});
    } else if(type==='wave'){
      for(let i=0;i<4;i++)setTimeout(()=>playTone({f1:300+i*100,f2:600+i*80,dur:0.15,vol:0.2}),i*80);
    } else if(type==='buy'){
      playTone({f1:523,f2:784,dur:0.08,vol:0.2});
      setTimeout(()=>playTone({f1:784,f2:1047,dur:0.1,vol:0.18}),80);
    } else if(type==='deny'){
      playTone({type:'sawtooth',f1:200,f2:120,dur:0.15,vol:0.25});
    } else if(type==='gameover'){
      playNoise(0.5,0.4,'low');
      playTone({type:'sawtooth',f1:300,f2:40,dur:1.8,vol:0.35,rel:2.0});
    } else if(type==='zombiemoan'){
      playTone({type:'sawtooth',f1:80+Math.random()*40,f2:60,dur:0.6+Math.random()*0.4,vol:0.04+Math.random()*0.04});
    } else if(type==='coin'){
      playTone({f1:700,f2:1100,dur:0.08,vol:0.15});
    }
  }catch(e){}
}

// ─── PIXEL SPRITE RENDERER ──────────────────────────────────
// All sprites drawn procedurally with small pixel grids
function drawPixelSprite(sprite,x,y,scale,flip,tint){
  const pw=scale||3;
  ctx.save();
  if(flip){ctx.translate(x+sprite[0].length*pw,y);ctx.scale(-1,1);ctx.translate(-x,0);}
  if(tint){ctx.globalCompositeOperation='source-atop';}
  for(let row=0;row<sprite.length;row++){
    for(let col=0;col<sprite[row].length;col++){
      const c=sprite[row][col];
      if(c&&c!=='.'){
        ctx.fillStyle=PALETTE[c]||c;
        ctx.fillRect(x+col*pw,y+row*pw,pw,pw);
      }
    }
  }
  ctx.restore();
}

function defaultSave(){return{coins:0,character:'officer',weaponUpgrades:{pistol:{damage:0,mag:0},shotgun:{damage:0,mag:0},smg:{damage:0,mag:0},rifle:{damage:0,mag:0}},ownedChars:{officer:true}};}

// Returns CG data module if available, else localStorage, else null
function getStorage(){
  try{if(window.localStorage)return window.localStorage;}catch(e){}
  return null;
}

function loadSave(){
  try{const store=getStorage();if(!store)return defaultSave();const s=store.getItem(SAVE_KEY);return s?Object.assign(defaultSave(),JSON.parse(s)):defaultSave();}
  catch(e){return defaultSave();}
}

function persistSave(){
  try{const store=getStorage();if(store)store.setItem(SAVE_KEY,JSON.stringify(saveData));}catch(e){}
}

function getWeapon(key){
  const b={...BASE_WEAPONS[key]};
  const u=saveData.weaponUpgrades[key],ch=CHARACTERS[saveData.character];
  b.damage=b.damage*UPGRADE_DMG[u.damage]*ch.stats.damageMult;
  b.magSize=Math.round(b.magSize*UPGRADE_MAG[u.mag]*ch.stats.magMult);
  return b;
}

function spawnZ(g){
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=Math.random()*1920;y=-30;}
  else if(side===1){x=1950;y=Math.random()*1080;}
  else if(side===2){x=Math.random()*1920;y=1110;}
  else{x=-30;y=Math.random()*1080;}
  const roll=Math.random()+Math.min(0.35,(g.wave-1)*0.045);
  const type=roll<0.5?'normal':roll<0.7?'fast':roll<0.88?'tank':'exploder';
  const st={
    normal:{hp:2+Math.floor(g.wave*0.4),spd:2.0+g.wave*0.1,sz:22,pts:100,coins:5,sprite:SPRITE_ZOMBIE,ss:2},
    fast:{hp:1,spd:4.0+g.wave*0.14,sz:15,pts:150,coins:8,sprite:SPRITE_FAST,ss:2},
    tank:{hp:10+g.wave*2,spd:1.2+g.wave*0.04,sz:36,pts:350,coins:22,sprite:SPRITE_TANK,ss:2},
    exploder:{hp:3,spd:2.5+g.wave*0.09,sz:24,pts:220,coins:14,sprite:SPRITE_EXPLODER,ss:2},
  };
  const s=st[type];
  g.zombies.push({x,y,type,hp:s.hp,maxhp:s.hp,spd:s.spd,sz:s.sz,pts:s.pts,coins:s.coins,
    sprite:s.sprite,ss:s.ss,angle:0,wob:Math.random()*100,hit:0,footT:0});
}

function tryReload(g){
  const w=getWeapon(g.weapon);
  if(reloading||g.mag===w.magSize||g.ammo<=0)return;
  reloading=true;reloadT=w.reloadTime;snd('reload');
}

function shootBullets(g,tx,ty){
  const w=getWeapon(g.weapon);
  if(g.mag<=0){snd('empty');tryReload(g);return;}
  g.mag--;snd(w.snd);
  setTimeout(()=>snd('shell'),80);
  flashTimer=8;
  const ba=Math.atan2(ty-g.py,tx-g.px);
  for(let i=0;i<w.pellets;i++){
    const a=ba+(Math.random()-0.5)*w.spread*2;
    g.bullets.push({x:g.px,y:g.py,vx:Math.cos(a)*w.bSpd,vy:Math.sin(a)*w.bSpd,life:w.bLife,dmg:w.damage,trail:[]});
  }
  // spawn casing
  const ca=ba+Math.PI/2+(Math.random()-0.5)*0.4;
  casings.push({x:g.px,y:g.py,vx:Math.cos(ca)*3+Math.random()*2,vy:Math.sin(ca)*3+Math.random()*2-2,life:120,maxLife:120,rot:Math.random()*Math.PI*2,rotSpd:(Math.random()-0.5)*0.4});
  if(g.mag===0&&g.ammo>0)tryReload(g);
}

function addBlood(x,y,n=14){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1.5+Math.random()*8;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:22,maxLife:22,col:Math.random()<0.6?'#bb0000':'#880000',sz:3+Math.random()*4,type:'blood'});
  }
  pools.push({x,y,r:8+Math.random()*12,a:0.7});
}

function addExplosion(x,y,big){
  const n=big?60:28;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1.5+Math.random()*(big?15:9);
    const cols=['#ff4400','#ff8800','#ffcc00','#ff2200','#ff6600'];
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:big?38:22,maxLife:big?38:22,col:cols[Math.floor(Math.random()*cols.length)],sz:4+Math.random()*6,type:'fire'});
  }
  // smoke
  for(let i=0;i<(big?20:10);i++){
    const a=Math.random()*Math.PI*2,s=0.5+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:big?50:30,maxLife:big?50:30,col:'#333333',sz:6+Math.random()*10,type:'smoke'});
  }
  shake.t=big?24:14;shake.x=(Math.random()-0.5)*(big?24:14);shake.y=(Math.random()-0.5)*(big?24:14);
}

function spawnDrop(x,y,kills,g){
  const r=Math.random();
  const missing=WKEYS.filter(w=>!g.weapons[w]);
  let d;
  if(kills%15===0&&missing.length>0){d={kind:'weapon',weapon:missing[Math.floor(Math.random()*missing.length)]};}
  else if(r<0.14){d={kind:'ammo',amount:40};}
  else if(r<0.26){d={kind:'health',amount:35};}
  else if(r<0.36){d={kind:'speed',dur:360};}
  else return;
  drops.push({x,y,...d,life:500,bob:0});
}

// ─── UPDATE ──────────────────────────────────────────────────
function update(dt){
  titleAnim+=dt*0.001;
  if(state==='story'){storyTimer+=dt;return;}
  for(const z of bgZ){z.x+=Math.cos(z.a)*z.s;z.y+=Math.sin(z.a)*z.s;z.t+=0.05;z.a+=Math.sin(z.t)*0.02;if(z.x<-40)z.x=1960;if(z.x>1960)z.x=-40;if(z.y<-40)z.y=1120;if(z.y>1120)z.y=-40;}
  if(state==='gameover'){goAnim+=dt;return;}
  if(state!=='playing')return;
  const g=gs;
  const ch=CHARACTERS[g.character];

  // Ghost passive
  if(g.character==='ghost'){ghostTimer+=dt;if(ghostTimer>10000){ghostTimer=0;ghostActive=true;}if(ghostActive)g.invul=Math.max(g.invul,100);if(ghostActive&&g.invul<5)ghostActive=false;}

  // Moan timer
  moanTimer+=dt;if(moanTimer>3000+Math.random()*4000&&g.zombies.length>0){moanTimer=0;snd('zombiemoan');}

  // Reload
  if(reloading){reloadT-=dt;if(reloadT<=0){reloading=false;const w=getWeapon(g.weapon);const need=w.magSize-g.mag;const take=Math.min(need,g.ammo);g.mag+=take;g.ammo-=take;}}

  // Player movement
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;
  if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;
  if(dx||dy){const d=Math.sqrt(dx*dx+dy*dy);dx/=d;dy/=d;}
  const rage=g.character==='berserker'?Math.min(1.6,1+g.kills*0.008):1;
  const spd=g.spd*rage+(g.boost>0?3:0);
  const nx=Math.max(20,Math.min(1900,g.px+dx*spd));
  const ny=Math.max(20,Math.min(1060,g.py+dy*spd));
  if(!colObs(nx,g.py,18))g.px=nx;
  if(!colObs(g.px,ny,18))g.py=ny;
  g.pangle=Math.atan2(my-g.py,mx-g.px);
  if(g.boost>0)g.boost--;
  if(dx||dy){g.footstepT+=spd;if(g.footstepT>30){g.footstepT=0;// footstep dust
    parts.push({x:g.px+(Math.random()-0.5)*10,y:g.py+8,vx:(Math.random()-0.5)*1.5,vy:0.5+Math.random(),life:16,maxLife:16,col:'#33332a',sz:4,type:'dust'});
  }}

  // Shoot
  shootT+=dt;
  if(shooting&&shootT>getWeapon(g.weapon).fireRate&&!reloading){shootT=0;shootBullets(g,mx,my);}
  if(keys['r']&&!reloading)tryReload(g);
  if(flashTimer>0)flashTimer--;

  // Bullets
  for(let i=g.bullets.length-1;i>=0;i--){
    const b=g.bullets[i];
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>5)b.trail.shift();
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.x<-10||b.x>1930||b.y<-10||b.y>1090||colObs(b.x,b.y,5)){
      // impact spark
      for(let j=0;j<5;j++)parts.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:8,maxLife:8,col:'#ffaa00',sz:2,type:'spark'});
      g.bullets.splice(i,1);continue;
    }
    let hit=false;
    for(let j=g.zombies.length-1;j>=0;j--){
      const z=g.zombies[j];
      if(Math.hypot(b.x-z.x,b.y-z.y)<z.sz){
        addBlood(z.x,z.y,9);z.hp-=b.dmg;z.hit=12;
        if(z.hp<=0){
          addExplosion(z.x,z.y,z.type==='exploder');snd('kill');
          g.score+=z.pts;g.kills++;g.waveKills++;
          g.coins+=z.coins;
          coinAnims.push({x:z.x,y:z.y,amount:z.coins,life:80,vy:-2.5});
          spawnDrop(z.x,z.y,g.kills,g);
          g.zombies.splice(j,1);
        }
        g.bullets.splice(i,1);hit=true;break;
      }
    }
  }

  // Spawn
  spawnT+=dt;
  const sr=Math.max(280,2000-(g.wave-1)*130);
  if(spawnT>sr&&g.zombies.length<14+g.wave*2){spawnT=0;spawnZ(g);}

  // Zombie AI
  for(let i=g.zombies.length-1;i>=0;i--){
    const z=g.zombies[i];
    const dx2=g.px-z.x,dy2=g.py-z.y;const d=Math.sqrt(dx2*dx2+dy2*dy2)||1;
    const nx2=z.x+dx2/d*z.spd,ny2=z.y+dy2/d*z.spd;
    if(!colObs(nx2,z.y,z.sz))z.x=nx2;if(!colObs(z.x,ny2,z.sz))z.y=ny2;
    z.angle=Math.atan2(dy2,dx2);z.wob+=0.1;if(z.hit>0)z.hit--;
    // footstep
    z.footT+=z.spd;if(z.footT>40){z.footT=0;parts.push({x:z.x+(Math.random()-0.5)*8,y:z.y+z.sz*0.5,vx:(Math.random()-0.5),vy:0.5,life:12,maxLife:12,col:'#2a1a0a',sz:3,type:'dust'});}
    if(d<z.sz+20&&g.invul<=0){
      const dmg=z.type==='tank'?4:z.type==='exploder'?8:2;
      g.hp-=dmg;g.invul=26;snd('hurt');shake.t=10;shake.x=(Math.random()-0.5)*12;shake.y=(Math.random()-0.5)*12;
      if(z.type==='exploder'){addExplosion(z.x,z.y,true);g.zombies.splice(i,1);}
      if(g.hp<=0){doGameOver();return;}
    }
  }
  if(g.invul>0)g.invul--;

  // Wave
  if(g.waveKills>=g.waveTarget){
    g.wave++;g.waveKills=0;g.waveTarget=Math.floor(g.waveTarget*1.45);snd('wave');waveBanner='WAVE '+g.wave;waveBannerT=130;
    if(g.wave%5===0){}
  }

  // Drops
  for(let i=drops.length-1;i>=0;i--){
    const dr=drops[i];dr.life--;dr.bob+=0.1;if(dr.life<=0){drops.splice(i,1);continue;}
    if(Math.hypot(g.px-dr.x,g.py-dr.y)<28){
      snd('pickup');
      if(dr.kind==='ammo')g.ammo+=dr.amount;
      else if(dr.kind==='health')g.hp=Math.min(g.maxhp,g.hp+dr.amount);
      else if(dr.kind==='speed')g.boost=dr.dur;
      else if(dr.kind==='weapon'){g.weapons[dr.weapon]=true;g.weapon=dr.weapon;const nw=getWeapon(dr.weapon);g.mag=nw.magSize;g.ammo+=nw.magSize*3;reloading=false;}
      drops.splice(i,1);
    }
  }

  // Coin anims
  for(let i=coinAnims.length-1;i>=0;i--){const c=coinAnims[i];c.y+=c.vy;c.vy*=0.96;c.life--;if(c.life<=0)coinAnims.splice(i,1);}

  // Casings
  for(let i=casings.length-1;i>=0;i--){const c=casings[i];c.x+=c.vx;c.y+=c.vy;c.vy+=0.08;c.vx*=0.95;c.rot+=c.rotSpd;c.life--;if(c.life<=0)casings.splice(i,1);}

  // Particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=p.type==='smoke'?0.94:0.88;p.vy*=p.type==='smoke'?0.94:0.88;if(p.type==='smoke')p.vy-=0.05;p.life--;if(p.life<=0)parts.splice(i,1);}
  if(shake.t>0){shake.t--;shake.x*=0.75;shake.y*=0.75;}
}

// ─── DRAW ────────────────────────────────────────────────────
function drawFloor(arena){
  // Tiled floor with subtle variation
  const a=ARENAS[arena];
  ctx.fillStyle=a.bg;ctx.fillRect(0,0,CW,CH);
  // floor tiles
  const ts=60;
  for(let x=0;x<CW;x+=ts){for(let y=0;y<CH;y+=ts){
    const shade=((x/ts+y/ts)%2===0)?a.floor:a.grid;
    ctx.fillStyle=shade;ctx.fillRect(x,y,ts-1,ts-1);
    // subtle detail dots
    if((x+y)%120===0){ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(x+20,y+20,2,2);ctx.fillRect(x+40,y+40,2,2);}
  }}
  // obstacles with depth
  for(const o of ARENAS[arena].obs){
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(o.x+6,o.y+6,o.w,o.h);
    // face
    ctx.fillStyle=a.wallFace;ctx.fillRect(o.x,o.y,o.w,o.h);
    // top highlight
    ctx.fillStyle=a.wall;ctx.fillRect(o.x,o.y,o.w,4);
    // left highlight
    ctx.fillRect(o.x,o.y,4,o.h);
    // edge detail
    ctx.strokeStyle=a.acc+'22';ctx.lineWidth=1;ctx.strokeRect(o.x,o.y,o.w,o.h);
    // label
    if(o.label){ctx.fillStyle=a.acc+'33';ctx.font='10px "Share Tech Mono", monospace';ctx.textAlign='center';ctx.fillText(o.label,o.x+o.w/2,o.y+o.h/2+4);}
  }
}

function drawMenuBg(){
  ctx.fillStyle='#060608';ctx.fillRect(0,0,CW,CH);
  // animated scan lines
  const off=(titleAnim*15)%80;
  for(let y=off;y<CH;y+=80){ctx.fillStyle='rgba(255,255,255,0.012)';ctx.fillRect(0,y,CW,1);}
  // bg zombies (sprites now)
  for(const z of bgZ){
    ctx.save();ctx.translate(z.x,z.y);ctx.globalAlpha=0.12;
    ctx.rotate(z.a);
    const sp=z.type==='fast'?SPRITE_FAST:z.type==='tank'?SPRITE_TANK:z.type==='exploder'?SPRITE_EXPLODER:SPRITE_ZOMBIE;
    drawPixelSprite(sp,-sp[0].length,-(sp.length),1.5);
    ctx.restore();
  }
  // vignette
  const vg=ctx.createRadialGradient(CW/2,CH/2,300,CW/2,CH/2,1000);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.7)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,CW,CH);
}

function drawLogo(cx,cy,sc=1){
  ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);
  // glow
  ctx.shadowColor='#cc0000';ctx.shadowBlur=60*Math.abs(Math.sin(titleAnim*1.5));
  // DEAD CITY
  ctx.fillStyle='#cc1111';ctx.font='110px "Bebas Neue", cursive';ctx.textAlign='center';ctx.fillText('DEAD CITY',0,-20);
  ctx.strokeStyle='#ff0000';ctx.lineWidth=2;ctx.strokeText('DEAD CITY',0,-20);
  ctx.shadowBlur=0;
  // subtitle
  ctx.fillStyle='#888';ctx.font='28px "Bebas Neue", cursive';ctx.fillText('— LAST OFFICER STANDING —',0,26);
  // officer sprite large
  ctx.globalAlpha=0.9;
  drawPixelSprite(SPRITE_OFFICER,-21,-74,4.5);
  ctx.restore();
}

  ctx.fillText('█ INCIDENT REPORT #ZB-2049 █',CW/2,180);
  ctx.strokeStyle='#cc1111';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(CW/2-400,198);ctx.lineTo(CW/2+400,198);ctx.stroke();

    {t:2800, text:'"Communication with central command: LOST."',col:'#ccc'},
    {t:3400, text:'',col:'#888'},
    {t:3700, text:'CASUALTIES: ENTIRE PRECINCT STAFF',col:'#f44'},
    {t:4200, text:'SURVIVORS: 1',col:'#4f4'},
    {t:4700, text:'',col:'#888'},

}

function drawLB(){

function drawGameplay(){
  const g=gs,ar=ARENAS[g.arena];
  drawFloor(g.arena);

  // Blood pools
  for(const p of pools){ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*0.6,0,0,Math.PI*2);ctx.fillStyle=`rgba(80,0,0,${p.a})`;ctx.fill();}

  // Casings
  for(const c of casings){
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.globalAlpha=(c.life/c.maxLife)*0.8;
    drawPixelSprite(SPRITE_CASING,-2,-3,2);
    ctx.restore();
  }

  // Drops
  for(const dr of drops){
    const bob=Math.sin(dr.bob)*6;
    ctx.save();ctx.translate(dr.x,dr.y+bob);
    const pulse=0.7+0.3*Math.sin(dr.bob*2);
    ctx.globalAlpha=Math.min(1,dr.life/50)*pulse;
    if(dr.kind==='health'){drawPixelSprite(SPRITE_HEALTH,-12,-12,2);}
    else if(dr.kind==='ammo'){drawPixelSprite(SPRITE_AMMO,-12,-9,2);}
    else if(dr.kind==='weapon'){
      const ws=BASE_WEAPONS[dr.weapon].sprite;
      ctx.fillStyle=BASE_WEAPONS[dr.weapon].color+'44';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
      drawPixelSprite(ws,-ws[0].length*1.5,-ws.length*1.5,3);
    } else {
      // speed - coin spin
      drawPixelSprite(SPRITE_COIN,-9,-9,3);
    }
    ctx.restore();
  }

  // Bullets (with trail)
  for(const b of g.bullets){
    // Trail
    if(b.trail.length>1){
      ctx.beginPath();ctx.moveTo(b.trail[0].x,b.trail[0].y);
      for(const tp of b.trail)ctx.lineTo(tp.x,tp.y);
      ctx.strokeStyle='rgba(255,220,80,0.3)';ctx.lineWidth=2;ctx.stroke();
    }
    // Bullet dot
    ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
  }

  // Muzzle flash
  if(flashTimer>0&&g){
    ctx.save();ctx.translate(g.px,g.py);ctx.rotate(g.pangle);
    const fa=flashTimer/8;
    ctx.fillStyle=`rgba(255,200,50,${fa*0.6})`;ctx.beginPath();ctx.arc(28,0,18*fa,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,255,200,${fa*0.8})`;ctx.beginPath();ctx.arc(24,0,8*fa,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Zombies
  for(const z of g.zombies){
    ctx.save();ctx.translate(z.x,z.y);
    const wobX=Math.sin(z.wob)*3,wobY=Math.cos(z.wob*0.7)*2;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(wobX+4,z.sz*0.8+4,z.sz*0.7,z.sz*0.3,0,0,Math.PI*2);ctx.fill();
    // Hit flash
    if(z.hit>0){ctx.globalAlpha=0.5+0.5*(z.hit/12);ctx.fillStyle='#ff4444';ctx.beginPath();ctx.arc(wobX,wobY,z.sz+4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
    // Sprite — flip based on angle direction
    const flip=Math.cos(z.angle)<0;
    const sw=z.sprite[0].length*z.ss,sh=z.sprite.length*z.ss;
    drawPixelSprite(z.sprite,wobX-sw/2,wobY-sh*0.65,z.ss,flip);
    // HP bar
    if(z.maxhp>1){
      ctx.fillStyle='#1a1a1a';ctx.fillRect(wobX-z.sz,wobY-z.sz-12,z.sz*2,6);
      ctx.fillStyle=z.hp/z.maxhp>0.5?'#00cc44':'#ff4400';
      ctx.fillRect(wobX-z.sz,wobY-z.sz-12,z.sz*2*(z.hp/z.maxhp),6);
    }
    ctx.restore();
  }

  // Player
  const ch=CHARACTERS[g.character];
  ctx.save();ctx.translate(g.px,g.py);
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(5,10,14,6,0,0,Math.PI*2);ctx.fill();
  if(g.invul>0&&Math.floor(g.invul/4)%2===0)ctx.globalAlpha=0.25;
  if(ghostActive){ctx.globalAlpha=(ctx.globalAlpha||1)*0.45;ctx.shadowColor='#c8f';ctx.shadowBlur=24;}
  if(g.boost>0){ctx.shadowColor='#4ff';ctx.shadowBlur=20;}
  // Sprite rotated toward aim
  ctx.rotate(g.pangle);
  const sw=SPRITE_OFFICER[0].length*ch.spriteScale,sh=SPRITE_OFFICER.length*ch.spriteScale;
  drawPixelSprite(ch.sprite,-sw/2,-sh*0.7,ch.spriteScale);
  // Gun
  const gs2=BASE_WEAPONS[g.weapon].sprite;
  drawPixelSprite(gs2,0,-4,3);
  ctx.restore();ctx.globalAlpha=1;ctx.shadowBlur=0;

  // Particles
  for(const p of parts){
    ctx.globalAlpha=(p.life/p.maxLife)*(p.type==='smoke'?0.5:0.88);
    if(p.type==='smoke'){ctx.fillStyle=`rgba(50,50,50,${p.life/p.maxLife*0.5})`;}
    else ctx.fillStyle=p.col;
    const sz=p.sz*(p.type==='smoke'?1:p.life/p.maxLife);
    if(p.type==='smoke'){ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();}
    else{ctx.fillRect(p.x-sz/2,p.y-sz/2,sz,sz);}
  }
  ctx.globalAlpha=1;

  // HUD
  drawHUD(g);
}

function drawHUD(g){
  // HP bar
  const hp=g.hp/g.maxhp;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.roundRect(14,14,220,20,4);ctx.fill();
  ctx.fillStyle=hp>0.5?'#00cc44':hp>0.25?'#ffaa00':'#ff2222';
  ctx.beginPath();ctx.roundRect(14,14,220*hp,20,4);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=0.5;ctx.beginPath();ctx.roundRect(14,14,220,20,4);ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.roundRect(14,40,220,16,3);ctx.fill();
  ctx.fillStyle='#666';ctx.font='12px "Share Tech Mono", monospace';ctx.textAlign='left';ctx.fillText('HP  '+Math.max(0,g.hp)+' / '+g.maxhp,22,53);

  // Score / wave
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.beginPath();ctx.roundRect(CW-260,8,246,58,7);ctx.fill();
  ctx.fillStyle='#ffdd00';ctx.font='30px "Bebas Neue", cursive';ctx.textAlign='right';ctx.fillText(g.score.toLocaleString(),CW-18,40);
  ctx.fillStyle='#555';ctx.font='12px "Share Tech Mono", monospace';ctx.fillText('WAVE '+g.wave,CW-18,58);

  // Coins HUD
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.beginPath();ctx.roundRect(CW-260,74,180,34,5);ctx.fill();
  drawPixelSprite(SPRITE_COIN,CW-258,76,4);
  ctx.fillStyle='#ffd700';ctx.font='22px "Bebas Neue", cursive';ctx.textAlign='right';ctx.fillText(g.coins,CW-18,98);

  // Weapon slots
  const owned=WKEYS.filter(w=>g.weapons[w]);
  owned.forEach((w,i)=>{
    const act=g.weapon===w,bw=BASE_WEAPONS[w],sx=14+i*108;
    const sw=96,sh=48,sy=CH-sh-8;
    // background
    ctx.fillStyle=act?bw.color+'22':'rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(sx,sy,sw,sh,5);ctx.fill();
    ctx.strokeStyle=act?bw.color:'rgba(255,255,255,0.1)';ctx.lineWidth=act?1.5:0.5;ctx.beginPath();ctx.roundRect(sx,sy,sw,sh,5);ctx.stroke();
    // key hint
    ctx.fillStyle=act?bw.color:'#2a2a2a';ctx.font='9px "Share Tech Mono", monospace';ctx.textAlign='left';ctx.fillText(i+1,sx+5,sy+11);
    // weapon name — centered, bottom of card
    ctx.fillStyle=act?bw.color:'#444';
    ctx.font=(act?'bold ':'')+'13px "Share Tech Mono", monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(bw.name,sx+sw/2,sy+sh/2+2);
    ctx.textBaseline='alphabetic';
  });

  // Ammo
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.beginPath();ctx.roundRect(CW-180,CH-58,166,44,5);ctx.fill();
  ctx.fillStyle='#fa0';ctx.font='22px "Bebas Neue", cursive';ctx.textAlign='center';ctx.fillText(g.mag+' / '+g.ammo,CW-97,CH-28);
  ctx.fillStyle='#555';ctx.font='10px "Share Tech Mono", monospace';ctx.fillText('ROUNDS',CW-97,CH-14);

  // Reload bar
  if(reloading){
    const prog=1-(reloadT/getWeapon(g.weapon).reloadTime);
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.beginPath();ctx.roundRect(CW/2-130,CH-44,260,22,4);ctx.fill();
    ctx.fillStyle='#ff0';ctx.beginPath();ctx.roundRect(CW/2-130,CH-44,260*prog,22,4);ctx.fill();
    ctx.fillStyle='#000';ctx.font='bold 11px "Share Tech Mono", monospace';ctx.textAlign='center';ctx.fillText('RELOADING',CW/2,CH-28);
  }

  // Wave banner
  if(waveBannerT>0){
    waveBannerT--;
    ctx.globalAlpha=Math.min(1,waveBannerT/22);
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.beginPath();ctx.roundRect(CW/2-200,CH/2-70,400,80,10);ctx.fill();
    ctx.fillStyle='#ffff00';ctx.font='60px "Bebas Neue", cursive';ctx.textAlign='center';ctx.fillText(waveBanner,CW/2,CH/2-5);
    ctx.globalAlpha=1;
  }

  // Coin popups
  for(const c of coinAnims){
    ctx.globalAlpha=(c.life/c.maxLife)*0.9;
    ctx.fillStyle='#ffd700';ctx.font='22px "Bebas Neue", cursive';ctx.textAlign='center';
    ctx.fillText('+'+c.amount+'⚡',c.x,c.y);
    drawPixelSprite(SPRITE_COIN,c.x+22,(c.y-12),2);
  }
  ctx.globalAlpha=1;

  // Status indicators
  if(g.boost>0){ctx.fillStyle='rgba(0,200,255,0.7)';ctx.font='12px "Share Tech Mono", monospace';ctx.textAlign='left';ctx.fillText('⚡ SPEED BOOST',16,80);}
  if(g.character==='ghost'){
    const cd=Math.max(0,10-ghostTimer/1000);
    ctx.fillStyle=ghostActive?'rgba(200,140,255,0.8)':'#444';ctx.font='12px "Share Tech Mono", monospace';ctx.textAlign='left';
    ctx.fillText(ghostActive?'PHASE ACTIVE':'PHASE READY IN: '+(cd<0.1?'NOW!':cd.toFixed(1)+'s'),16,96);
  }
  if(g.character==='berserker'&&g.kills>0){const r=Math.min(1.6,1+g.kills*0.008);ctx.fillStyle='rgba(255,60,60,0.8)';ctx.font='12px "Share Tech Mono", monospace';ctx.textAlign='left';ctx.fillText('RAGE: x'+r.toFixed(2)+' speed',16,g.character==='ghost'?112:96);}
}

function drawPause(){
  ctx.fillStyle='rgba(0,0,0,0.76)';ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='rgba(6,6,8,0.98)';ctx.beginPath();ctx.roundRect(CW/2-210,CH/2-240,420,480,14);ctx.fill();
  ctx.strokeStyle='#cc1111';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(CW/2-210,CH/2-240,420,480,14);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='32px "Bebas Neue", cursive';ctx.textAlign='center';ctx.fillText('II PAUSED',CW/2,CH/2-186);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(CW/2-180,CH/2-168);ctx.lineTo(CW/2+180,CH/2-168);ctx.stroke();
  const g=gs;
  [['SCORE',g.score.toLocaleString()],['WAVE',g.wave],['KILLS',g.kills],['HP',g.hp+'/'+g.maxhp],['COINS',g.coins]].forEach(([l,v],i)=>{
    const y=CH/2-140+i*46;
    ctx.fillStyle='#2a2a2a';ctx.font='13px "Share Tech Mono", monospace';ctx.textAlign='left';ctx.fillText(l,CW/2-180,y);
    ctx.fillStyle='#ccc';ctx.font='16px "Bebas Neue", cursive';ctx.textAlign='right';ctx.fillText(v,CW/2+180,y);
  });
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(CW/2-180,CH/2+98);ctx.lineTo(CW/2+180,CH/2+98);ctx.stroke();
  [['resume','RESUME',CH/2+116],['menu','MENU',CH/2+168]].forEach(([id,lbl,y])=>{
    const hov=hoverBtn===id;
    ctx.fillStyle=id==='resume'?(hov?'#cc1111':'#881111'):(hov?'#1e1e1e':'#111');ctx.beginPath();ctx.roundRect(CW/2-170,y,340,42,7);ctx.fill();
    ctx.fillStyle=id==='resume'?'#fff':'#777';ctx.font='18px "Bebas Neue", cursive';ctx.textAlign='center';ctx.fillText(lbl,CW/2,y+27);
  });
  ctx.fillStyle='#2a2a2a';ctx.font='11px "Share Tech Mono", monospace';ctx.textAlign='center';ctx.fillText('ESC to resume',CW/2,CH/2+226);
}

function drawGameOver(){
  drawFloor(gs.arena);
  const prog=Math.min(1,goAnim/1500);
  // darkness
  const vg=ctx.createRadialGradient(CW/2,CH/2,Math.max(0,1200*(1-prog*0.7)),CW/2,CH/2,1400);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.95)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,CW,CH);
  if(prog<0.18)return;
  const fade=Math.min(1,(prog-0.18)/0.4);
  ctx.globalAlpha=fade;
  // blood drips
  const drips=[[120,0.25],[320,0.7],[580,0.15],[900,0.88],[1160,0.45],[1380,0.6],[1650,0.3],[1840,0.78]];
  for(const[dx,ph] of drips){
    const dl=Math.min(CH*0.72,goAnim*0.42*ph);
    const grd=ctx.createLinearGradient(dx,0,dx,dl);grd.addColorStop(0,'rgba(150,0,0,0.72)');grd.addColorStop(1,'rgba(150,0,0,0)');
    ctx.fillStyle=grd;ctx.fillRect(dx-6,0,12,dl);
    ctx.beginPath();ctx.arc(dx,dl,8+ph*5,0,Math.PI*2);ctx.fillStyle='rgba(110,0,0,0.5)';ctx.fill();
  }
  // panel
  ctx.fillStyle='rgba(3,0,0,0.95)';ctx.beginPath();ctx.roundRect(CW/2-380,CH/2-340,760,680,18);ctx.fill();
  ctx.strokeStyle='rgba(200,0,0,0.4)';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(CW/2-380,CH/2-340,760,680,18);ctx.stroke();
  // GAME OVER
  ctx.save();ctx.shadowColor='#ff0000';ctx.shadowBlur=50*Math.abs(Math.sin(titleAnim*4.5));
  ctx.fillStyle='#ff1a1a';ctx.font='94px "Bebas Neue", cursive';ctx.textAlign='center';ctx.fillText('GAME OVER',CW/2,CH/2-256);
  ctx.restore();
  ctx.strokeStyle='rgba(180,0,0,0.22)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(CW/2-340,CH/2-224);ctx.lineTo(CW/2+340,CH/2-224);ctx.stroke();
  // Draw dead officer sprite
  ctx.save();ctx.translate(CW/2-280,CH/2-180);ctx.rotate(Math.PI/2);ctx.globalAlpha=0.4;
  drawPixelSprite(SPRITE_OFFICER,-21,-74,4.5);ctx.restore();
  const g=gs;
  const isHigh=lb.length>0&&lb[0].score===g.score&&g.score>0;
  if(isHigh){ctx.fillStyle='rgba(255,220,0,0.1)';ctx.beginPath();ctx.roundRect(CW/2-320,CH/2-216,640,42,5);ctx.fill();ctx.fillStyle='#ffdd00';ctx.font='26px "Bebas Neue", cursive';ctx.textAlign='center';ctx.fillText('★  NEW HIGH SCORE  ★',CW/2,CH/2-188);}
  const stats=[['SCORE',g.score.toLocaleString(),'#ffdd00'],['WAVE',g.wave,'#4af'],['KILLS',g.kills,'#f84'],['COINS EARNED',g.coins,'#ffd700'],['LOCATION',ARENAS[g.arena].name,'#888']];
  stats.forEach(([lbl,val,col],i)=>{
    const y=CH/2-(isHigh?128:152)+i*72;
    ctx.fillStyle='rgba(255,255,255,0.014)';ctx.beginPath();ctx.roundRect(CW/2-320,y-26,640,56,5);ctx.fill();
    ctx.fillStyle='#2a2a2a';ctx.font='14px "Share Tech Mono", monospace';ctx.textAlign='left';ctx.fillText(lbl,CW/2-300,y+10);
    ctx.fillStyle=col;ctx.font='28px "Bebas Neue", cursive';ctx.textAlign='right';ctx.fillText(val,CW/2+300,y+10);
  });
  ctx.strokeStyle='rgba(180,0,0,0.18)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(CW/2-320,CH/2+246);ctx.lineTo(CW/2+320,CH/2+246);ctx.stroke();
  [['retry','PLAY AGAIN',CW/2-310],['menu','MENU',CW/2+20]].forEach(([id,lbl,bx])=>{
    const hov=hoverBtn===id,isRetry=id==='retry';
    ctx.fillStyle=isRetry?(hov?'#cc1111':'#881111'):(hov?'#1e1e1e':'#111');ctx.beginPath();ctx.roundRect(bx,CH/2+258,270,52,8);ctx.fill();
    ctx.strokeStyle=hov?'#444':'#1e1e1e';ctx.lineWidth=0.5;ctx.beginPath();ctx.roundRect(bx,CH/2+258,270,52,8);ctx.stroke();
    ctx.fillStyle=isRetry?'#fff':'#777';ctx.font='22px "Bebas Neue", cursive';ctx.textAlign='center';ctx.fillText(lbl,bx+135,CH/2+291);
  });
  ctx.globalAlpha=1;
}

// ─── MAIN DRAW LOOP ──────────────────────────────────────────
function draw(){
  ctx.save();
  if(state==='playing'&&shake.t>0)ctx.translate(Math.round(shake.x),Math.round(shake.y));
  ctx.clearRect(-30,-30,CW+60,CH+60);
  if(state==='story'){drawStory();}
  else if(state==='menu'){drawMenu();}
  else if(state==='lb'){drawLB();}
  else if(state==='shop'){drawShop();}
  else if(state==='gameover'){drawGameOver();}
  else if(state==='playing'||state==='paused'){
    drawGameplay();
    if(state==='paused')drawPause();
  }
  ctx.restore();
  // Crosshair always drawn last, always on top, unaffected by shake
  drawCrosshair();
}

function drawCrosshair(){
  const inGame=state==='playing'||state==='paused';
  const size=inGame?18:14;
  const gap=inGame?7:5;
  const col=inGame?'rgba(255,40,40,0.95)':'rgba(200,200,200,0.7)';
  const col2=inGame?'rgba(255,40,40,0.5)':'rgba(200,200,200,0.4)';
  ctx.save();
  ctx.lineWidth=inGame?2:1.5;
  ctx.strokeStyle=col;
  // horizontal
  ctx.beginPath();ctx.moveTo(mx-size,my);ctx.lineTo(mx-gap,my);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mx+gap,my);ctx.lineTo(mx+size,my);ctx.stroke();
  // vertical
  ctx.beginPath();ctx.moveTo(mx,my-size);ctx.lineTo(mx,my-gap);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mx,my+gap);ctx.lineTo(mx,my+size);ctx.stroke();
  // outer circle
  ctx.strokeStyle=col2;ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(mx,my,inGame?5:4,0,Math.PI*2);ctx.stroke();
  // center dot
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(mx,my,inGame?2:1.5,0,Math.PI*2);ctx.fill();
  // dynamic spread when shooting
  if(inGame&&shooting&&gs){
    const spread=WEAPONS_SPREAD[gs.weapon]||0;
    if(spread>0){
      ctx.strokeStyle='rgba(255,100,100,0.3)';ctx.lineWidth=0.5;
      ctx.beginPath();ctx.arc(mx,my,5+spread*80,0,Math.PI*2);ctx.stroke();
    }
  }
  ctx.restore();
}

// weapon spread reference for crosshair bloom
const WEAPONS_SPREAD={pistol:0,shotgun:0.36,smg:0.11,rifle:0.015};

function loop(ts){
  const dt=Math.min(ts-lastT,50);lastT=ts;
  update(dt);draw();
  requestAnimationFrame(loop);
}

// ─── INPUT ───────────────────────────────────────────────────
function coords(e){
  const r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(CW/r.width),y:(e.clientY-r.top)*(CH/r.height)};
}
function arenaAt(x,y){
  const cH=190,cGap=14,cSx=1070,cSy=140;
  for(let i=0;i<AKEYS.length;i++){if(x>=cSx&&x<=cSx+760&&y>=cSy+i*(cH+cGap)&&y<=cSy+i*(cH+cGap)+cH)return AKEYS[i];}
  return null;
}
function menuBtnAt(x,y,st){
  if(st==='story'&&storyTimer>6500)return'story_start';
  if(st==='menu'){
    if(y>=560&&y<=608){if(x>=366&&x<=566)return'start';if(x>=580&&x<=780)return'shop';if(x>=794&&x<=954)return'lb';}
  }
  if(st==='lb'){if(x>=860&&x<=1060&&y>=950&&y<=996)return'back';}
  if(st==='shop'){
    if(y>=154&&y<=198){if(x>=390&&x<=830)return'tabs_chars';if(x>=950&&x<=1390)return'tabs_upgrades';}
    if(y>=990&&y<=1034&&x>=860&&x<=1060)return'shopback';
    if(shopTab==='chars'){
      const cardW=312,gap=16,total=CKEYS.length,sx=(CW-total*cardW-(total-1)*gap)/2;
      for(let i=0;i<CKEYS.length;i++){
        const k=CKEYS[i],cx=sx+i*(cardW+gap);
        const ch=CHARACTERS[k],sp=ch.sprite,ss=ch.spriteScale;
        const spy=224+20;
        const dy=spy+ch.sprite.length*ss+70;
        const sdy=dy+50;
        const pdy=sdy+220,bby=pdy+46;
        if(x>=cx+16&&x<=cx+cardW-16&&y>=bby&&y<=bby+34){return saveData.ownedChars[k]?'charselect_'+k:'charbuy_'+k;}
        if(x>=cx&&x<=cx+cardW)return'char_'+k;
      }
    } else {
      const cardW=420,gap=28,total=WKEYS.length,sx=(CW-total*cardW-(total-1)*gap)/2;
      for(let i=0;i<WKEYS.length;i++){
        const k=WKEYS[i],cx=sx+i*(cardW+gap);
        const w=BASE_WEAPONS[k],spy=230+22,baseY=spy+w.sprite.length*3+58;
        if(x>=cx+22&&x<=cx+cardW-22&&y>=baseY+44&&y<=baseY+80)return'dmg_'+k;
        if(x>=cx+22&&x<=cx+cardW-22&&y>=(baseY+112+44)&&y<=(baseY+112+80))return'mag_'+k;
      }
    }
  }
  if(st==='paused'){
    if(x>=CW/2-170&&x<=CW/2+170){if(y>=CH/2+116&&y<=CH/2+158)return'resume';if(y>=CH/2+168&&y<=CH/2+210)return'menu';}
  }
  if(st==='gameover'){
    if(y>=CH/2+258&&y<=CH/2+310){if(x>=CW/2-310&&x<=CW/2-40)return'retry';if(x>=CW/2+20&&x<=CW/2+290)return'menu';}
  }
  return null;
}
function shopHoverAt(x,y){return menuBtnAt(x,y,'shop');}

canvas.addEventListener('mousemove',e=>{
  const{x,y}=coords(e);mx=x;my=y;
  hoverArena=state==='menu'?arenaAt(x,y):null;
  hoverBtn=menuBtnAt(x,y,state);
  hoverShop=state==='shop'?shopHoverAt(x,y):null;
});

canvas.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  initAudio();
  const{x,y}=coords(e);
  const btn=menuBtnAt(x,y,state);
  if(state==='story'){if(storyTimer>6500||btn==='story_start')state='menu';else storyTimer=7000;return;}
  if(state==='menu'){const a=arenaAt(x,y);if(a){chosenArena=a;return;}if(btn==='start')startGame();else if(btn==='shop')state='shop';else if(btn==='lb')state='lb';return;}
  if(state==='lb'){if(btn==='back')state='menu';return;}
  if(state==='shop'){
    const hit=menuBtnAt(x,y,'shop');
    if(hit==='shopback'){state='menu';return;}
    if(hit==='tabs_chars'){shopTab='chars';return;}if(hit==='tabs_upgrades'){shopTab='upgrades';return;}
    if(hit&&hit.startsWith('charselect_')){saveData.character=hit.replace('charselect_','');snd('buy');persistSave();return;}
    if(hit&&hit.startsWith('charbuy_')){const k=hit.replace('charbuy_',''),ch=CHARACTERS[k];if(saveData.coins>=ch.price){saveData.coins-=ch.price;saveData.ownedChars[k]=true;snd('buy');persistSave();}else snd('deny');return;}
    if(hit&&hit.startsWith('dmg_')){const k=hit.replace('dmg_',''),u=saveData.weaponUpgrades[k];if(u.damage<5){const c=UPGRADE_COSTS.damage[u.damage];if(saveData.coins>=c){saveData.coins-=c;u.damage++;snd('buy');persistSave();}else snd('deny');}return;}
    if(hit&&hit.startsWith('mag_')){const k=hit.replace('mag_',''),u=saveData.weaponUpgrades[k];if(u.mag<5){const c=UPGRADE_COSTS.mag[u.mag];if(saveData.coins>=c){saveData.coins-=c;u.mag++;snd('buy');persistSave();}else snd('deny');}return;}
    return;
  }
  if(state==='paused'){if(btn==='resume'){state='playing';}else if(btn==='menu')doMenu();return;}
  if(state==='gameover'){if(btn==='retry')doRestart();else if(btn==='menu')doMenu();return;}
  shooting=true;shootT=9999;
});
canvas.addEventListener('mouseup',e=>{if(e.button===0)shooting=false;});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(state==='story'){initAudio();if(storyTimer>2000){state='menu';}else storyTimer=7000;return;}
  if(k==='escape'){if(state==='playing'){state='paused';}else if(state==='paused'){state='playing';}}
  if(k==='p'&&state==='playing'){state='paused';}
  if(state==='playing'&&gs){if(e.key==='1')swW(0);else if(e.key==='2')swW(1);else if(e.key==='3')swW(2);else if(e.key==='4')swW(3);}
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function swW(i){if(!gs)return;const owned=WKEYS.filter(w=>gs.weapons[w]);if(owned[i]){const w=owned[i];if(w===gs.weapon)return;gs.weapon=w;reloading=false;if(gs.mag===0)tryReload(gs);}}


function startGame(){
  state='playing';gs=newGame(chosenArena);waveBanner='WAVE 1';waveBannerT=130;goAnim=0;
}
function doGameOver(){
  state='gameover';goAnim=0;shooting=false;snd('gameover');
  saveData.coins+=gs.coins;
  persistSave();
  addLB(gs.score,gs.wave,gs.kills,gs.arena,gs.character);
}
function doRestart(){gs=newGame(chosenArena);state='playing';goAnim=0;waveBanner='WAVE 1';waveBannerT=130;}
function doMenu(){state='menu';shooting=false;}

// Signal loading complete on first rendered frame, then hand off to normal loop
let _cgFirstFrame=true;
function cgBootLoop(ts){
  if(_cgFirstFrame){_cgFirstFrame=false;}
  const dt=Math.min(ts-lastT,50);lastT=ts;
  update(dt);draw();
  requestAnimationFrame(cgBootLoop);
}
requestAnimationFrame(cgBootLoop);
</script>
